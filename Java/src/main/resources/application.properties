# =====================================================================================
# Cau hinh mau cho luong Init Refund V4 (JWS ngoai boc JWE trong).
# Xem: ZDocs/API_Refund_V4.md trong repo ACQHUB de doi chieu tung truong.
# =====================================================================================

# --- Thong tin doi tac / merchant tren duong dan va lop ngoai cua request ---
partner.code=XXXTEST
mid=0302203609
tid=00000001

# --- Endpoint VCB. Doi sang URL that (UAT/PROD) khi tich hop that. ---
# Mac dinh tro vao mock server chay bang: gradlew runMockServer
vcb.baseUrl=http://localhost:8080
vcb.oauth.tokenUrl=${vcb.baseUrl}/oauth/token
vcb.oauth.clientId=sample-client-id
vcb.oauth.clientSecret=sample-client-secret
# %s se duoc thay bang partner.code
vcb.refundV4.urlTemplate=${vcb.baseUrl}/api/acqhub/utilities/partner/v4/%s/refund

# =====================================================================================
# Bo khoa JWS/JWE - dung cho chieu doi tac goi VCB (client that su/mock deu doc chung).
# 4 muc duoi day tuong ung dung 4 cot trong VCB_ACQ_PAYMENT_KEYS (goc nhin tu phia doi tac):
#   - merchant.jws.*  : khoa CUA CHINH DOI TAC, dung de KY request     -> gui MERCHANT_JWS_CERT cho VCB
#   - vcb.jwe.*       : cert CONG KHAI cua VCB, dung de MA HOA request (VCB_JWE_CERT, VCB cap cho doi tac)
#   - vcb.jws.*       : cert CONG KHAI cua VCB, dung de VERIFY response (VCB_JWS_CERT, VCB cap cho doi tac)
#   - merchant.jwe.*  : khoa CUA CHINH DOI TAC, dung de GIAI MA response -> gui MERCHANT_JWE_CERT cho VCB
# Private key KHONG BAO GIO duoc gui cho VCB; chi gui phan *-cert.pem (public).
# =====================================================================================

merchant.jws.kid=MERCHANT_JWS_KID_SAMPLE
merchant.jws.privateKeyPath=certs/partner/jws-private.p8.pem

vcb.jwe.kid=VCB_JWE_KID_SAMPLE
vcb.jwe.certPath=certs/vcb/jwe-cert.pem

vcb.jws.certPath=certs/vcb/jws-cert.pem
vcb.jws.expectedKid=VCB_JWS_KID_SAMPLE

merchant.jwe.kid=MERCHANT_JWE_KID_SAMPLE
merchant.jwe.privateKeyPath=certs/partner/jwe-private.p8.pem

# =====================================================================================
# Chi dung cho MockVcbServer (gia lap phia VCB de chay thu end-to-end tren may local).
# Cac private key nay trong doi thuc te nam o phia VCB, KHONG bao gio xuat hien o phia doi tac.
# Xoa het phan nay khi chuyen sang goi endpoint VCB that.
# =====================================================================================
mock.server.port=8080
mock.vcb.jws.privateKeyPath=certs/mock-only/vcb-jws-private.p8.pem
mock.vcb.jws.kid=VCB_JWS_KID_SAMPLE
mock.vcb.jwe.privateKeyPath=certs/mock-only/vcb-jwe-private.p8.pem
mock.merchant.jws.certPath=certs/partner/jws-cert.pem
mock.merchant.jws.expectedKid=MERCHANT_JWS_KID_SAMPLE
mock.merchant.jwe.certPath=certs/partner/jwe-cert.pem
mock.merchant.jwe.kid=MERCHANT_JWE_KID_SAMPLE
